<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager — Spring Boot API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a40;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --green: #00e5a0;
            --green-glow: rgba(0, 229, 160, 0.2);
            --red: #ff4d6d;
            --yellow: #ffd166;
            --text: #e8e8f0;
            --text-muted: #6b6b8a;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'Space Grotesk', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            overflow-x: hidden;
        }

        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            padding: 32px 48px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            background: rgba(10,10,15,0.8);
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h1 .badge {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            padding: 3px 8px;
            background: var(--accent-glow);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .header-left p {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 8px var(--green-glow);
            animation: pulse 2s infinite;
        }

        .status-dot.offline { background: var(--red); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        
        .layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 89px);
        }

        .sidebar {
            border-right: 1px solid var(--border);
            padding: 32px 28px;
            overflow-y: auto;
            background: rgba(18,18,26,0.5);
        }

        .sidebar h2 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea { height: 90px; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-row span {
            font-size: 14px;
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #7c74ff;
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        .api-log {
            margin-top: 32px;
        }

        .api-log h2 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .log-entries {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            font-family: var(--mono);
            font-size: 11px;
            padding: 8px 10px;
            background: var(--surface);
            border-radius: 5px;
            border-left: 3px solid var(--border);
            display: flex;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-entry.success { border-left-color: var(--green); }
        .log-entry.error { border-left-color: var(--red); }

        .log-method { font-weight: 600; min-width: 45px; }
        .log-method.GET { color: var(--green); }
        .log-method.POST { color: var(--accent); }
        .log-method.PUT { color: var(--yellow); }
        .log-method.DELETE { color: var(--red); }
        .log-path { color: var(--text-muted); flex: 1; }
        .log-status { font-weight: 600; }
        .log-status.ok { color: var(--green); }
        .log-status.err { color: var(--red); }

   
        .main {
            padding: 32px 40px;
            overflow-y: auto;
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .task-count {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-muted);
        }

        .task-count span {
            color: var(--accent);
            font-weight: 600;
        }

        .filter-tabs {
            display: flex;
            gap: 4px;
        }

        .tab {
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--text-muted);
            background: transparent;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--surface2);
            border-color: var(--border);
            color: var(--text);
        }

        .tab:hover:not(.active) {
            color: var(--text);
        }

       
        .tasks-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .task-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--border);
            transition: background 0.2s;
        }

        .task-card:hover {
            border-color: #3a3a55;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .task-card.completed::before { background: var(--green); }
        .task-card.editing::before { background: var(--accent); }


        .task-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-check:hover { border-color: var(--green); }
        .task-check.done {
            background: var(--green);
            border-color: var(--green);
        }

        .task-check.done::after {
            content: '✓';
            color: #0a0a0f;
            font-size: 13px;
            font-weight: 700;
        }

  
        .task-info {}

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            transition: all 0.2s;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .task-meta {
            font-family: var(--mono);
            font-size: 10px;
            color: #3d3d5a;
            margin-top: 6px;
        }

       
        .task-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .task-card:hover .task-actions { opacity: 1; }

        .task-id {
            font-family: var(--mono);
            font-size: 10px;
            color: #2a2a42;
            position: absolute;
            top: 8px;
            right: 12px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .icon-btn:hover.edit { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .icon-btn:hover.delete { border-color: var(--red); color: var(--red); background: rgba(255,77,109,0.1); }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
        .empty-state p { font-size: 14px; }

 
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 14px 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 320px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-left: 3px solid var(--green); }
        .toast.error { border-left: 3px solid var(--red); }

    
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 16px;
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 13px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .endpoints {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .endpoints h2 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .endpoint-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-family: var(--mono);
            font-size: 11px;
        }

        .method-badge {
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 10px;
            min-width: 50px;
            text-align: center;
        }

        .method-badge.GET { background: rgba(0,229,160,0.15); color: var(--green); }
        .method-badge.POST { background: rgba(108,99,255,0.15); color: var(--accent); }
        .method-badge.PUT { background: rgba(255,209,102,0.15); color: var(--yellow); }
        .method-badge.DELETE { background: rgba(255,77,109,0.15); color: var(--red); }

        .endpoint-path { color: var(--text-muted); }


        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <h1>
            Task Manager
            <span class="badge">REST API</span>
        </h1>
        <p>Spring Boot · http://localhost:8080/api/tasks</p>
    </div>
    <div class="server-status" id="serverStatus">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Checking server...</span>
    </div>
</header>

<div class="layout">

  
    <aside class="sidebar">
        <h2 id="formTitle">New Task</h2>

        <div class="form-group">
            <label>TITLE *</label>
            <input type="text" id="taskTitle" placeholder="What needs to be done?" />
        </div>

        <div class="form-group">
            <label>DESCRIPTION</label>
            <textarea id="taskDesc" placeholder="Add details (optional)..."></textarea>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="taskCompleted" />
            <span>Mark as completed</span>
        </div>

        <button class="btn btn-primary" onclick="submitForm()">
            <span id="submitBtnText"> Create Task</span>
        </button>
        <button class="btn btn-secondary" onclick="cancelEdit()" id="cancelBtn" style="display:none;">
            Cancel Edit
        </button>

    
        <div class="endpoints">
            <h2>API Endpoints</h2>
            <div class="endpoint-item">
                <span class="method-badge GET">GET</span>
                <span class="endpoint-path">/api/tasks</span>
            </div>
            <div class="endpoint-item">
                <span class="method-badge GET">GET</span>
                <span class="endpoint-path">/api/tasks/{id}</span>
            </div>
            <div class="endpoint-item">
                <span class="method-badge POST">POST</span>
                <span class="endpoint-path">/api/tasks</span>
            </div>
            <div class="endpoint-item">
                <span class="method-badge PUT">PUT</span>
                <span class="endpoint-path">/api/tasks/{id}</span>
            </div>
            <div class="endpoint-item">
                <span class="method-badge DELETE">DELETE</span>
                <span class="endpoint-path">/api/tasks/{id}</span>
            </div>
        </div>

 
        <div class="api-log">
            <h2>API Log</h2>
            <div class="log-entries" id="logEntries">
                <div class="log-entry">
                    <span class="log-method" style="color: var(--text-muted);">---</span>
                    <span class="log-path">Waiting for requests...</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="main-header">
            <div class="task-count">
                <span id="taskCount">0</span> tasks
            </div>
            <div class="filter-tabs">
                <button class="tab active" onclick="setFilter('all', this)">All</button>
                <button class="tab" onclick="setFilter('active', this)">Active</button>
                <button class="tab" onclick="setFilter('done', this)">Done</button>
            </div>
        </div>

        <div id="taskList" class="tasks-grid">
            <div class="loading">
                <div class="spinner"></div>
                <span>Connecting to API...</span>
            </div>
        </div>
    </main>
</div>


<div class="toast" id="toast"></div>

<script>
    const API_BASE = 'http://localhost:8080/api/tasks';
    let tasks = [];
    let editingId = null;
    let currentFilter = 'all';

    
    function logAPI(method, path, status) {
        const container = document.getElementById('logEntries');
        const isOk = status >= 200 && status < 300;

        
        if (container.children.length === 1 && container.children[0].textContent.includes('Waiting')) {
            container.innerHTML = '';
        }

        const entry = document.createElement('div');
        entry.className = `log-entry ${isOk ? 'success' : 'error'}`;
        entry.innerHTML = `
            <span class="log-method ${method}">${method}</span>
            <span class="log-path">${path}</span>
            <span class="log-status ${isOk ? 'ok' : 'err'}">${status}</span>
        `;

        container.insertBefore(entry, container.firstChild);

        
        while (container.children.length > 8) {
            container.removeChild(container.lastChild);
        }
    }

   
    async function apiCall(method, path, body) {
        try {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);

            const res = await fetch(API_BASE + path, options);
            logAPI(method, '/api/tasks' + path, res.status);
            return { ok: res.ok, status: res.status, data: await res.json() };
        } catch (err) {
            logAPI(method, '/api/tasks' + path, 'ERR');
            return { ok: false, error: err.message };
        }
    }

   
    async function checkServer() {
        try {
            const res = await fetch(API_BASE, { method: 'GET' });
            document.getElementById('statusDot').className = 'status-dot online';
            document.getElementById('statusText').textContent = 'localhost:8080 ● online';
        } catch {
            document.getElementById('statusDot').className = 'status-dot offline';
            document.getElementById('statusText').textContent = 'Server offline';
        }
    }

    
    async function loadTasks() {
        const result = await apiCall('GET', '');
        if (result.ok) {
            tasks = result.data;
            renderTasks();
        } else {
            document.getElementById('taskList').innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚡</div>
                    <h3>Cannot connect to server</h3>
                    <p>Make sure Spring Boot is running on port 8080</p>
                    <p style="margin-top:8px;font-family:var(--mono);font-size:12px;color:#4a4a6a;">
                        Run: mvn spring-boot:run
                    </p>
                </div>`;
        }
    }

    
    function renderTasks() {
        let filtered = tasks;
        if (currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
        if (currentFilter === 'done') filtered = tasks.filter(t => t.completed);

        document.getElementById('taskCount').textContent = filtered.length;

        if (filtered.length === 0) {
            document.getElementById('taskList').innerHTML = `
                <div class="empty-state">
                    <div class="icon">✓</div>
                    <h3>No tasks here</h3>
                    <p>Create a task using the form on the left</p>
                </div>`;
            return;
        }

        document.getElementById('taskList').innerHTML = filtered.map(task => `
            <div class="task-card ${task.completed ? 'completed' : ''} ${editingId === task.id ? 'editing' : ''}"
                 id="card-${task.id}">
                <div class="task-check ${task.completed ? 'done' : ''}"
                     onclick="toggleTask(${task.id}, ${task.completed})"></div>
                <div class="task-info">
                    <div class="task-title">${escHtml(task.title)}</div>
                    ${task.description ? `<div class="task-desc">${escHtml(task.description)}</div>` : ''}
                    <div class="task-meta">${formatDate(task.createdAt)}</div>
                </div>
                <div class="task-actions">
                    <button class="icon-btn edit" onclick="startEdit(${task.id})" title="Edit">✎</button>
                    <button class="icon-btn delete" onclick="deleteTask(${task.id})" title="Delete">✕</button>
                </div>
                <div class="task-id">#${task.id}</div>
            </div>
        `).join('');
    }

    async function toggleTask(id, currentState) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        const result = await apiCall('PUT', `/${id}`, {
            title: task.title,
            description: task.description,
            completed: !currentState
        });

        if (result.ok) {
            task.completed = !currentState;
            renderTasks();
        }
    }

    
    async function submitForm() {
        const title = document.getElementById('taskTitle').value.trim();
        const description = document.getElementById('taskDesc').value.trim();
        const completed = document.getElementById('taskCompleted').checked;

        if (!title) {
            showToast(' Title is required', 'error');
            document.getElementById('taskTitle').focus();
            return;
        }

        if (editingId !== null) {
            
            const result = await apiCall('PUT', `/${editingId}`, { title, description, completed });
            if (result.ok) {
                const idx = tasks.findIndex(t => t.id === editingId);
                if (idx !== -1) tasks[idx] = result.data;
                showToast('✓ Task updated', 'success');
                cancelEdit();
                renderTasks();
            } else {
                showToast('✕ Update failed', 'error');
            }
        } else {
           
            const result = await apiCall('POST', '', { title, description, completed });
            if (result.ok) {
                tasks.push(result.data);
                showToast('✓ Task created', 'success');
                clearForm();
                renderTasks();
            } else {
                showToast('✕ Create failed: ' + (result.data?.error || 'Unknown error'), 'error');
            }
        }
    }

    
    function startEdit(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        editingId = id;
        document.getElementById('taskTitle').value = task.title;
        document.getElementById('taskDesc').value = task.description || '';
        document.getElementById('taskCompleted').checked = task.completed;
        document.getElementById('formTitle').textContent = 'Edit Task #' + id;
        document.getElementById('submitBtnText').textContent = '✎ Update Task';
        document.getElementById('cancelBtn').style.display = 'block';

        renderTasks();
        document.getElementById('taskTitle').focus();
    }

    function cancelEdit() {
        editingId = null;
        clearForm();
        document.getElementById('formTitle').textContent = 'New Task';
        document.getElementById('submitBtnText').textContent = '➕ Create Task';
        document.getElementById('cancelBtn').style.display = 'none';
        renderTasks();
    }

    function clearForm() {
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskCompleted').checked = false;
    }

   async function deleteTask(id) {
        const result = await apiCall('DELETE', `/${id}`);
        if (result.ok) {
            tasks = tasks.filter(t => t.id !== id);
            if (editingId === id) cancelEdit();
            showToast('✓ Task deleted', 'success');
            renderTasks();
        } else {
            showToast('✕ Delete failed', 'error');
        }
    }

   function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderTasks();
    }

   
    let toastTimer;
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    
    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            return new Date(dateStr).toLocaleString('en-US', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        } catch { return ''; }
    }

    
    document.getElementById('taskTitle').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitForm();
    });

  
    checkServer();
    loadTasks();
    setInterval(checkServer, 10000); 
</script>
</body>
</html>
